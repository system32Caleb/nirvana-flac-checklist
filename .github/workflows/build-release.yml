name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate release signing keystore
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -hex 24)
          KEY_PASSWORD=$(openssl rand -hex 24)
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias nirvana \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Nirvana FLAC Checklist"
          echo "KEYSTORE=release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=nirvana" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Check APK size
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK"
          echo "Size: $SIZE bytes"
          if [ "$SIZE" -ge 5242880 ]; then
            echo "El APK supera el límite de 5 MB."
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nirvana-flac-checklist-apk
          path: ${{ env.APK_PATH }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-ghrelease@v2
        with:
          files: ${{ env.APK_PATH }}
          body: |
            ## Nirvana FLAC Checklist

            - Versión: ${{ github.ref_name }}
            - Tamaño del APK: ${{ env.APK_SIZE }} bytes
            - Compatibilidad: Android 10 (API 29) o superior
            - Incluye catálogo local, checklist persistente, búsqueda, filtros, progreso y exportación/importación JSON.
            - La aplicación no descarga ni incluye música protegida por derechos de autor.
